<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/icon3.png">
    <link rel="stylesheet" href="todo.css">
    <title>2BDone</title>
</head>
<body>
    <header class="header">
        <h1> <span id="t1">2B<span id="t2">Done</span></span> </h1>
        <nav class="headerNav">
        </nav>
    </header>
    <div class="divBody"  >
        <div class="todoContainer">
            <div class="todoInputArea">
                <input id="taskInput" type="text" placeholder="Enter a task...">
                <button id="addBtn">Add</button>
            </div>
            <span id="inputAlert"></span>
            <div class="todoTop">
                <h2 class="myList">My list</h2>
                <div id="progressStats">
                    <div id="progressBar"><div id="progress"></div></div>
                    <div id="progressCount" type="number">0/0</div>
                </div>
            </div>
        <div class="historyLink">
             <a href="history.html" class="history" title="View your recently completed tasks" >History</a>
        </div>
            <ul id="todoList">
            </ul>
        <div id="clearBtn">Clear list</div>

        </div>
    </div>

    <footer>
        <div> &copy; <span id="year"></span> 2BDone. All rights reserved.</div>
    </footer>

    <script src="todo.js"></script>
</body>
</html>
