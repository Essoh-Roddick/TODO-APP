<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="todo.css">
    <title>2BDone</title>
</head>
<body>
    <header>
        <h1> <span id="t1">2B</span> <span id="t2">Done</span></h1>
    </header>
    <div class="divBody"  >
        <div class="todoContainer">
            <div todoTop>
                <h2>My list</h2>
            </div>
            <div todoAdd>
                <input id="taskInput" type="text" placeholder="Enter a task">
                <button id="addBtn">Add</button>
            </div>
            <ul id="todoList">
                <li class="todoItem">
                    <input type="checkbox">
                    <span class="taskText">Create a todo list </span>
                    <div class="task">
                        <span class="editBtn">Edit</span> 
                        <span class="deleteBtn">Delete</span>
                    </div> 
                </li>
                <li class="todoItem">
                    <input type="checkbox">
                    <span class="taskText">Create a todo list </span>
                    <div class="task">
                        <span class="editBtn">Edit</span> 
                        <span class="deleteBtn">Delete</span>
                    </div> 
                </li>
            </ul>

        </div>
    </div>

    <footer>
        <div> &copy; <span id="year"></span> 2BDone. All rights reserved.</div>
    </footer>

    <script src="todo.js"></script>
</body>
</html>
