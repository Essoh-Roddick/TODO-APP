<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="todo.css">
    <title>2BDone</title>
</head>
<body>
    <header>
        <h1> <span id="t1">2B</span> <span id="t2">Done</span></h1>
    </header>
    <div class="divBody"  >
        <div class="todoContainer">
            <div class="todoInputArea">
                <input id="taskInput" type="text" placeholder="Enter a task...">
                <button id="addBtn">Add</button>
            </div>
            <div class="todoTop">
                <h2 class="myList">My list</h2>
                <div id="progressStats">
                    <div id="progressBar"><div id="progress"></div></div>
                    <div id="progressCount">2/3</div>
                </div>
            </div>
            <ul id="todoList">
                <li class="todoItem">
                     <div class="todoCheckText">
                        <input  type="checkbox" class="checkbox">
                        <span class="taskText">Create a todo list nnnnnnnnnnn nnnnnnnnnnnnnnnnn bnfxfbsbccxcx cvnnnnnnnnnnnnnnnnnnnn nmnxzzdfcgvbmmdvnnnnnnnnnn </span>
                    </div>
                    <div class="actionBtn">
                        <span class="editBtn">Edit</span> 
                        <span class="deleteBtn">Delete</span>
                    </div> 
                </li>
                <li class="todoItem">
                    <div>
                        <input  type="checkbox" class="checkbox">
                        <span class="taskText">Create a todo list </span>
                    </div>
                    <div class="actionBtn">
                        <span class="editBtn">Edit</span> 
                        <span class="deleteBtn">Delete</span>
                    </div> 
                </li>
            </ul>

        </div>
    </div>

    <footer>
        <div> &copy; <span id="year"></span> 2BDone. All rights reserved.</div>
    </footer>

    <script src="todo.js"></script>
</body>
</html>
